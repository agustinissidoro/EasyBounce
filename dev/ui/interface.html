<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bounce Clips</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #2b2b2b;
        --panel: #333333;
        --panel-2: #3b3b3b;
        --line: #1f1f1f;
        --text: #e2e2e2;
        --dim: #9a9a9a;
        --accent: #ff8c00;
        --accent-text: #1a1a1a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 12px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px 4px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        align-content: start;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 10px 12px 12px;
      }
      section.wide { grid-column: 1 / -1; }
      h2 {
        font-size: 10px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
        margin: 0 0 9px;
        font-weight: 600;
      }
      label { display: block; }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
      }
      .row + .row { margin-top: 5px; }
      .row .spacer { flex: 1; }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 12px;
      }
      .hint {
        color: var(--dim);
        font-size: 11px;
        margin-top: 8px;
      }
      input[type="text"], input[type="number"], select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 4px 6px;
        font: inherit;
        min-width: 0;
      }
      input[type="text"] { width: 100%; }
      input[type="number"] { width: 68px; text-align: right; }
      input:disabled, select:disabled { opacity: 0.4; }
      input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); margin: 0; }
      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 5px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: #474747; }
      button.primary {
        background: var(--accent);
        color: var(--accent-text);
        border-color: #c96f00;
        font-weight: 600;
      }
      button.primary:hover { background: #ffa033; }
      button.primary:disabled { background: #6b5227; color: #a5a5a5; cursor: default; }
      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      footer .spacer { flex: 1; }
      #preview {
        margin-top: 8px;
        max-height: 104px;
        overflow-y: auto;
        background: #262626;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 6px 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: #c8c8c8;
        white-space: pre;
      }
      .banner {
        grid-column: 1 / -1;
        background: #4a3213;
        border: 1px solid #7a5416;
        border-radius: 5px;
        padding: 9px 12px;
        color: #ffcf8f;
      }
      .banner.hidden { display: none; }
      .unit { color: var(--dim); }
    </style>
  </head>

  <body>
    <main>
      <div class="banner hidden" id="ffmpeg-banner">
        <div id="ffmpeg-message"></div>
        <div class="row" style="margin-top: 8px">
          <span>ffmpeg path</span>
          <input type="text" id="ffmpeg-path" placeholder="/opt/homebrew/bin/ffmpeg" />
        </div>
      </div>

      <section>
        <h2>File names</h2>
        <div class="row">
          <input type="radio" name="naming" id="name-clip" value="clip" />
          <label for="name-clip">Clip name</label>
        </div>
        <div class="row">
          <input type="radio" name="naming" id="name-track" value="track-index" />
          <label for="name-track">Track name + index</label>
        </div>
        <div class="row">
          <input type="radio" name="naming" id="name-custom" value="custom-index" />
          <label for="name-custom">Name + index</label>
          <input type="text" id="custom-name" style="flex: 1" />
        </div>
        <div class="row" style="margin-top: 8px">
          <label for="start-index">Start at</label>
          <input type="number" id="start-index" min="0" step="1" />
          <div class="spacer"></div>
          <input type="checkbox" id="pad-index" />
          <label for="pad-index">Pad with zeros</label>
        </div>
      </section>

      <section>
        <h2>Level &amp; channels</h2>
        <div class="row">
          <input type="checkbox" id="normalize" />
          <label for="normalize">Normalize peak to</label>
          <input type="number" id="normalize-db" step="0.1" min="-60" max="0" />
          <span class="unit">dBFS</span>
        </div>
        <div class="row">
          <input type="checkbox" id="mono" />
          <label for="mono">Bounce to mono</label>
        </div>
        <div class="row">
          <input type="checkbox" id="mono-fake" />
          <label for="mono-fake">Mono only if fake stereo</label>
        </div>
        <div class="hint">Fake stereo means both channels are identical, so folding down loses nothing.</div>
      </section>

      <section>
        <h2>Edges</h2>
        <div class="row">
          <input type="checkbox" id="trim-start" />
          <label for="trim-start">Trim silent start</label>
          <div class="spacer"></div>
          <input type="checkbox" id="trim-end" />
          <label for="trim-end">Trim silent end</label>
        </div>
        <div class="row">
          <label for="trim-db">Silence below</label>
          <input type="number" id="trim-db" step="1" min="-96" max="-6" />
          <span class="unit">dBFS</span>
        </div>
        <div class="grid2" style="margin-top: 10px">
          <div class="row">
            <label for="fade-in">Fade in</label>
            <div class="spacer"></div>
            <input type="number" id="fade-in" min="0" step="1" />
            <span class="unit">ms</span>
          </div>
          <div class="row">
            <label for="fade-out">Fade out</label>
            <div class="spacer"></div>
            <input type="number" id="fade-out" min="0" step="1" />
            <span class="unit">ms</span>
          </div>
          <div class="row">
            <label for="pad-start">Silence at start</label>
            <div class="spacer"></div>
            <input type="number" id="pad-start" min="0" step="1" />
            <span class="unit">ms</span>
          </div>
          <div class="row">
            <label for="pad-end">Silence at end</label>
            <div class="spacer"></div>
            <input type="number" id="pad-end" min="0" step="1" />
            <span class="unit">ms</span>
          </div>
        </div>
        <div class="hint">Fades are baked into the audio that is already there and never change the length. Silence does add time.</div>
      </section>

      <section class="wide">
        <h2>Output</h2>
        <div class="row">
          <label for="output-dir" style="white-space: nowrap">Folder</label>
          <input type="text" id="output-dir" />
          <button id="browse">Browse…</button>
        </div>
        <div class="row" style="margin-top: 8px">
          <label for="format">Format</label>
          <select id="format">
            <option value="wav">WAV</option>
            <option value="aiff">AIFF</option>
            <option value="mp3">MP3</option>
            <option value="ogg">Ogg Vorbis</option>
          </select>
          <label for="depth" style="margin-left: 8px">Depth</label>
          <select id="depth">
            <option value="16">16 bit</option>
            <option value="24">24 bit</option>
            <option value="32">32 bit</option>
          </select>
          <label for="bitrate" style="margin-left: 8px">Bitrate</label>
          <select id="bitrate">
            <option value="128">128 kbps</option>
            <option value="192">192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
          <label for="rate" style="margin-left: 8px">Rate</label>
          <select id="rate">
            <option value="0">As rendered</option>
            <option value="44100">44.1 kHz</option>
            <option value="48000">48 kHz</option>
            <option value="88200">88.2 kHz</option>
            <option value="96000">96 kHz</option>
            <option value="192000">192 kHz</option>
          </select>
        </div>
        <div id="preview"></div>
      </section>
    </main>

    <footer>
      <span id="status" class="unit"></span>
      <div class="spacer"></div>
      <button id="cancel">Cancel</button>
      <button id="bounce" class="primary">Bounce</button>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      let context = null;

      function post(result) {
        const message = { method: "close_and_send", params: [result] };
        if (window.webkit?.messageHandlers?.live) {
          window.webkit.messageHandlers.live.postMessage(message);
        } else if (window.chrome?.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      /** Reads every control back into the options object the host expects. */
      function readOptions() {
        return {
          outputDir: $("output-dir").value.trim(),
          naming: {
            mode: document.querySelector("input[name=naming]:checked").value,
            customName: $("custom-name").value,
            startIndex: Number($("start-index").value) || 0,
            padIndex: $("pad-index").checked,
          },
          normalize: {
            enabled: $("normalize").checked,
            targetDb: Number($("normalize-db").value),
          },
          channels: {
            mono: $("mono").checked,
            monoIfFakeStereo: $("mono-fake").checked,
          },
          trim: {
            start: $("trim-start").checked,
            end: $("trim-end").checked,
            thresholdDb: Number($("trim-db").value),
          },
          fade: {
            inMs: Math.max(0, Number($("fade-in").value) || 0),
            outMs: Math.max(0, Number($("fade-out").value) || 0),
          },
          pad: {
            startMs: Math.max(0, Number($("pad-start").value) || 0),
            endMs: Math.max(0, Number($("pad-end").value) || 0),
          },
          output: {
            format: $("format").value,
            depth: Number($("depth").value),
            sampleRate: Number($("rate").value),
            bitrate: Number($("bitrate").value),
          },
        };
      }

      function writeOptions(options) {
        $("output-dir").value = options.outputDir;
        document.querySelector(
          `input[name=naming][value="${options.naming.mode}"]`,
        ).checked = true;
        $("custom-name").value = options.naming.customName;
        $("start-index").value = options.naming.startIndex;
        $("pad-index").checked = options.naming.padIndex;
        $("normalize").checked = options.normalize.enabled;
        $("normalize-db").value = options.normalize.targetDb;
        $("mono").checked = options.channels.mono;
        $("mono-fake").checked = options.channels.monoIfFakeStereo;
        $("trim-start").checked = options.trim.start;
        $("trim-end").checked = options.trim.end;
        $("trim-db").value = options.trim.thresholdDb;
        $("fade-in").value = options.fade.inMs;
        $("fade-out").value = options.fade.outMs;
        $("pad-start").value = options.pad.startMs;
        $("pad-end").value = options.pad.endMs;
        $("format").value = options.output.format;
        $("depth").value = options.output.depth;
        $("rate").value = options.output.sampleRate;
        $("bitrate").value = options.output.bitrate;
      }

      /** Greys out controls that do not apply to the current choices. */
      function syncEnabled() {
        const compressed = $("format").value === "mp3" || $("format").value === "ogg";
        $("depth").disabled = compressed;
        $("bitrate").disabled = !compressed;
        $("custom-name").disabled = $("name-custom").checked === false;
        $("normalize-db").disabled = !$("normalize").checked;
        $("trim-db").disabled = !$("trim-start").checked && !$("trim-end").checked;
        $("mono-fake").disabled = $("mono").checked;

        const count = context?.clipCount ?? 0;
        $("bounce").textContent = count === 1 ? "Bounce 1 clip" : `Bounce ${count} clips`;
        $("bounce").disabled = count === 0 || !$("output-dir").value.trim();
      }

      let previewTimer;
      function schedulePreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(refreshPreview, 120);
      }

      async function refreshPreview() {
        const body = JSON.stringify({ options: readOptions() });
        try {
          const response = await fetch("api/preview", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body,
          });
          const { names } = await response.json();
          $("preview").textContent = names.length
            ? names.join("\n")
            : "Nothing to bounce.";
        } catch (error) {
          $("preview").textContent = String(error);
        }
      }

      async function load() {
        context = await (await fetch("api/context")).json();
        writeOptions(context.settings.options);
        $("ffmpeg-path").value = context.settings.ffmpegPath;

        // Grey out anything this ffmpeg build cannot encode.
        for (const option of $("format").options) {
          const supported = context.formats[option.value] !== false;
          option.disabled = !supported;
          option.textContent = supported
            ? option.textContent.replace(/ \(unavailable\)$/, "")
            : `${option.textContent} (unavailable)`;
        }
        if ($("format").selectedOptions[0]?.disabled) $("format").value = "wav";

        if (context.ffmpegStatus) {
          $("ffmpeg-banner").classList.remove("hidden");
          $("ffmpeg-message").textContent = context.ffmpegStatus;
        }

        // What is being bounced lives in the footer, next to the button that
        // does it, rather than in a panel of its own.
        const count = context.clipCount;
        const tracks = context.trackNames.join(", ");
        const notes = [
          context.which === "selection"
            ? `${count} clip${count === 1 ? "" : "s"} in the selection on ${tracks}`
            : `${count} clip${count === 1 ? "" : "s"} on ${tracks}`,
          "pre-effects, one file per clip",
        ];
        if (context.skippedTakeLaneClips > 0) {
          notes.push(`${context.skippedTakeLaneClips} on take lanes not included`);
        }
        $("status").textContent = notes.join(" · ");

        syncEnabled();
        refreshPreview();
      }

      document.addEventListener("input", () => {
        syncEnabled();
        schedulePreview();
      });
      document.addEventListener("change", () => {
        syncEnabled();
        schedulePreview();
      });

      $("browse").addEventListener("click", async () => {
        const { path } = await (await fetch("api/browse", { method: "POST" })).json();
        if (path) {
          $("output-dir").value = path.replace(/\/$/, "");
          syncEnabled();
          refreshPreview();
        }
      });

      $("cancel").addEventListener("click", () => post(""));
      $("bounce").addEventListener("click", () => {
        if ($("bounce").disabled) return;
        post(
          JSON.stringify({
            options: readOptions(),
            ffmpegPath: $("ffmpeg-path").value.trim(),
          }),
        );
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") post("");
      });

      // A half-applied load leaves the dialog in a state that looks fine but
      // is not, so surface the failure instead of swallowing it.
      load().catch((error) => {
        $("status").textContent = `Could not load: ${error}`;
        $("bounce").disabled = true;
      });
    </script>
  </body>
</html>
